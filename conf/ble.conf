# Bluetooth LE (host side), added by build.sh to every app build except --wired,
# together with the controller overlay: conf/openll.conf (default) or
# conf/blob.conf (--blob), plus conf/privacy.conf for --privacy.
# Applied via: -DEXTRA_CONF_FILE="conf/app.conf;conf/ble.conf;conf/openll.conf"
#
# Controller: the open link layer by default (conf/openll.conf); --blob selects
# the Telink blob (liblt_9518_zephyr.a, 2.8 MB). Blob: 1M PHY only, the
# blob's 2M PHY causes LL Response Timeout 0x22 after 40s.
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HCI_B91=y
CONFIG_BT_HCI_B91_RX_STACK_SIZE=2048
CONFIG_ZMK_BLE=y
# Passkey Entry: host displays 6-digit code, type it on the keyboard.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
# BLE privacy: DISABLED here (keeps the public identity, so bonds survive).
# With the open controller use ./build.sh --privacy (conf/privacy.conf), which
# needs every host to be paired again. The old "privacy hangs bt_enable() with
# the blob" was most likely the ZMK settings deadlock fixed by zmk-src 0005; the
# blob was not retested, so --privacy stays open-controller only.
# CONFIG_BT_PRIVACY=y

# mcumgr over BLE (SMP service): DFU without a cable, the second recovery path.
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
