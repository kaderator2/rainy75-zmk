# Open BLE link layer (issue #13), the default controller; build.sh applies this file unless --blob.
CONFIG_BT_HCI_B91_CTLR_OPEN=y
# Power counters over SMP (mcumgr group 66), read with reverse/tools/openll_stats.py.
CONFIG_OPENLL_MGMT=y
# CPU idle time for the power counters (+290 B ROM, +240 B RAM).
CONFIG_THREAD_RUNTIME_STATS=y
# Long PDUs (slice 6b Task 4, the open controller only): the host asks for
# 251-octet PDUs on every connection (LE Write Suggested Default Data Length
# 251 / 2120, then the LENGTH procedure), and ACL / L2CAP / ATT use them:
# host ACL buffers of 251 octets both ways (LE Read Buffer Size reports 251),
# L2CAP TX MTU 247 (= ATT MTU 247: 244-byte notifications and writes in one
# PDU, e.g. SMP and ZMK Studio over BLE).
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
# Connect stall (slice 7 Task 2 item 3): with lazy loading the host loads the
# peer's CCC values at every connection by scanning the whole NVS storage
# (interrupt-locked flash reads) in the cooperative BT RX work queue, about
# 1 s per reconnect during which no other thread runs. Load them at boot.
CONFIG_BT_SETTINGS_CCC_LAZY_LOADING=n
