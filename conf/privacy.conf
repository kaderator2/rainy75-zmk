# Resolvable private address for the open BLE link layer (./build.sh --privacy).
# Open controller only (build.sh refuses it with --blob; the blob was never tested
# with zmk-src 0005, which fixed the privacy startup deadlock).
# Enabling it requires re-pairing every host: bonds made without our IRK cannot
# resolve the RPA, so existing bonds will not reconnect.
# CONFIG_BT_RPA_TIMEOUT is left at the Zephyr default.
CONFIG_BT_PRIVACY=y
