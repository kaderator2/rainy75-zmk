# Risky test image (./build.sh --test-image): the image does not confirm itself.
# The watchdog is switched off instead, so it can run as long as needed, and any
# reset or power cycle goes back to the previous image, even if USB and BLE no
# longer work (with USB unplugged, the wireless switch under CapsLock cuts the
# power). Flash it with `mcumgr image upload` + `image test <hash>` + `reset`;
# confirm a good one with `mcumgr image confirm <hash>`. Never ship it.
CONFIG_RAINY75_MCUBOOT_MANUAL_CONFIRM=y
