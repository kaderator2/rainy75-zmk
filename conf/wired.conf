# Wired gaming build (./build.sh --wired): USB only, no Bluetooth, NKRO,
# no deep sleep, calm default lighting. Applied after conf/app.conf INSTEAD of
# conf/ble.conf and the controller overlays (conf/openll.conf / conf/blob.conf),
# so no Bluetooth symbol is ever assigned: no radio ISRs, no controller thread,
# no BLE host, no BLE SMP transport (USB DFU and USB Studio stay).
#
# The keymap drops the Bluetooth bindings (Fn+F1..F4, Fn+Del) in this build:
# build.sh passes the devicetree preprocessor symbol RAINY75_WIRED.

# Belt and braces: Bluetooth stays off even if a controller overlay sneaks in.
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# ── Input ────────────────────────────────────────────────────────────────────
# 6-key rollover (ZMK's default), the same HID report as the Bluetooth build.
# NKRO is NOT enabled yet: with CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y Windows 11
# never started the keyboard interface (the device enumerated, the serial
# ports worked, but the host never polled the HID IN endpoint 0x83 and every
# report write failed with -EAGAIN; verified 2026-10-08 on a Standard ANSI,
# with and without CONFIG_ZMK_USB_BOOT). Suspects: the NKRO report descriptor
# is exactly 96 bytes (a multiple of the 8-byte control endpoint; 6KRO has
# 97) and the 16-byte NKRO report fills the 16-byte interrupt endpoint. Under
# investigation in the B91 USB driver; do not switch it on without testing
# as a --test-image.
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# CONFIG_ZMK_USB_BOOT=y
# Snap Tap starts enabled on the first boot; Fn+T toggles it (persisted).
CONFIG_RAINY75_SNAP_TAP=y
CONFIG_RAINY75_SNAP_TAP_DEFAULT_ON=y
# Press debounce 0 ms (eager): conf/wired.overlay.

# ── Power ────────────────────────────────────────────────────────────────────
# A keyboard on a cable does not sleep (waking is a cold boot through
# MCUboot, 1-2 s). The B91 has no VBUS-detect pin, so with the ZMK default
# (this symbol off) is_usb_power_present() is always true and the idle
# sleep timeout never fires: deep sleep stays compiled in but never
# triggers. app.conf switches the symbol on for the battery builds. (Setting
# CONFIG_ZMK_SLEEP=n instead would make Kconfig warn about the dropped
# ZMK_IDLE_SLEEP_TIMEOUT / ZMK_USB_NO_VBUS_DETECT assignments of app.conf.)
# The LED idle blank stays available via CONFIG_RAINY_RGB_IDLE_BLANK.
CONFIG_ZMK_USB_NO_VBUS_DETECT=n

# ── Calm default lighting ────────────────────────────────────────────────────
# First boot only; the Fn+RGB controls persist their changes afterwards.
# Effects (zmk/src/rainy_rgb/effects.c): 0 solid, 1 rainbow, 2 plasma,
# 3 twinkle, 4 comet, 5 aurora, 6 reactive, 7 ripple, 8 wave, 9 rain,
# 10 heatmap, 11 speedcolour.
CONFIG_RAINY_RGB_DEFAULT_EFFECT=5
CONFIG_RAINY_RGB_DEFAULT_HUE=150
CONFIG_RAINY_RGB_DEFAULT_SAT=200
CONFIG_RAINY_RGB_DEFAULT_VAL=112
CONFIG_RAINY_RGB_DEFAULT_SPEED=12
